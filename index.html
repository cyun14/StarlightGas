<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Scene 1 -->
  <section id="scene1" class="scene">
    <div id="guy-wrap" class="sprite">
      <img id="guy" src="assets/diatom-guy.png" alt="Diatom guy" draggable="false">
    </div>
    <div id="hat-wrap" class="sprite">
      <img id="hat" class="bob" src="assets/hat.png" alt="Hat" draggable="false">
    </div>
    <div id="door-wrap" class="sprite hidden">
      <img id="door" src="assets/door.png" alt="Door" draggable="false">
    </div>
  </section>

  <!-- Scene 2 -->
  <section id="scene2" class="scene hidden">
    <div id="house-wrap" class="sprite">
      <img id="house" src="assets/house.png" alt="House" draggable="false">
    </div>
    <div id="guy2-wrap" class="sprite">
      <img id="guy2" class="bob" src="assets/diatom-guy-with-hat.png" alt="Diatom guy with hat" draggable="false">
    </div>
    <div id="car-wrap" class="sprite">
      <img id="car" src="assets/car.png" alt="Car" draggable="false">
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
